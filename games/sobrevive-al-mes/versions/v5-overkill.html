<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sobrevive al Mes - OVERKILL NEON</title>
<style>
    :root{
        --bg:#030407;
        --surface:#0b0f19;
        --surface-2:#131a2a;
        --ink:#f5f3ee;
        --muted:#68728a;
        --line:#1c253d;
        --lime:#b7ff00;
        --coral:#ff003c;
        --amber:#ffaa00;
        --blue:#00d0ff;
        --magenta:#ff006a;
        --gold:#ffcc00;
        --font-display: -apple-system, system-ui, sans-serif;
        --font-mono: "SF Mono", "Consolas", monospace;
    }

    *{ box-sizing:border-box; }

    html, body{
        margin:0; padding:0; min-height:100vh;
        background: linear-gradient(-45deg, #030407, #0a0512, #041014, #02080a);
        background-size: 400% 400%;
        animation: animBg 10s ease infinite;
        color:var(--ink);
        font-family:var(--font-display);
        font-size: 115%;
        overflow-x: hidden;
    }

    #scanlines {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        background-size: 100% 2px, 3px 100%;
        z-index: 99998; pointer-events: none; opacity: 0.6;
    }

    @keyframes animBg { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    #bgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; pointer-events: none; }
    #fx-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; pointer-events: none; overflow: hidden; }
    #trail-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99997; pointer-events: none; overflow: hidden; }

    #app{ max-width: 580px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding:20px 18px 45px; position: relative; z-index: 10; }

    @keyframes shake {
        0% { transform: translate(2px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -2px) rotate(-2deg); }
        20% { transform: translate(-3px, 0px) rotate(2deg); }
        30% { transform: translate(3px, 2px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(2deg); }
        50% { transform: translate(-1px, 2px) rotate(-2deg); }
        60% { transform: translate(-3px, 1px) rotate(0deg); }
        70% { transform: translate(3px, 1px) rotate(-2deg); }
        80% { transform: translate(-1px, -1px) rotate(2deg); }
        90% { transform: translate(1px, 2px) rotate(0deg); }
        100% { transform: translate(1px, -2px) rotate(-2deg); }
    }
    .shake-active { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

    button{ font-family:inherit; cursor:pointer; border:none; outline:none; }
    
    @keyframes btnGlow {
        0% { box-shadow: 0 0 20px rgba(183,255,0,0.5), inset 0 0 10px rgba(183,255,0,0.3); }
        50% { box-shadow: 0 0 45px rgba(183,255,0,1), inset 0 0 25px rgba(183,255,0,0.6); }
        100% { box-shadow: 0 0 20px rgba(183,255,0,0.5), inset 0 0 10px rgba(183,255,0,0.3); }
    }

    @keyframes slideUp { from { opacity: 0; transform: translateY(50px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-12px) rotate(1deg); } 100% { transform: translateY(0px) rotate(0deg); } }

    .start-screen, .tutorial-screen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; padding:20px 8px; animation: slideUp .8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    .start-badge{ font-family:var(--font-mono); letter-spacing:.2em; font-size:15px; color:var(--magenta); background:rgba(255,0,106,0.15); border:2px solid var(--magenta); box-shadow: 0 0 25px rgba(255,0,106,0.6); border-radius:999px; padding:10px 20px; text-transform:uppercase; font-weight: 900; }

    .start-title{ position: relative; font-size:64px; font-weight:900; letter-spacing:-0.03em; line-height:1.05; margin:15px 0 0; color: #fff; text-shadow: 0 0 20px rgba(0,208,255,0.8), 0 0 50px var(--blue); }
    
    @keyframes glitch-anim {
        0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
        20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
        40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
        60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
        80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
        100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
    }
    .start-title::before, .start-title::after { content: "SOBREVIVE AL MES"; position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8; }
    .start-title::before { left: 3px; text-shadow: -2px 0 var(--coral); animation: glitch-anim 2s infinite linear alternate-reverse; background: transparent; }
    .start-title::after { left: -3px; text-shadow: -2px 0 var(--blue); animation: glitch-anim 2.5s infinite linear alternate-reverse; background: transparent; }

    .start-desc{ font-size:18px; color:#a3b1c6; max-width:420px; line-height:1.6; margin:8px 0 16px; text-shadow: 0 0 10px rgba(255,255,255,0.2); }

    .btn-primary{ margin-top:20px; background:var(--lime); color:#000; font-weight:900; font-size:20px; letter-spacing:.05em; padding:20px 48px; border-radius:16px; text-transform: uppercase; animation: btnGlow 1.5s infinite; transition: all .2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .btn-primary:hover{ transform:translateY(-6px) scale(1.05); background: #ccff33; letter-spacing: .1em; }
    .btn-primary:active{ transform:translateY(0) scale(0.95); }

    .tut-box { background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(10px); border: 2px solid var(--line); box-shadow: 0 8px 32px rgba(0,0,0,0.8); border-radius: 16px; padding: 18px; text-align: left; width: 100%; max-width: 480px; font-size: 16px; color: #dce4f2; transition: all 0.3s; }
    .tut-box:hover { transform: scale(1.04) translateX(10px); border-color: var(--blue); box-shadow: -10px 10px 30px rgba(0,208,255,0.4); }
    .tut-box b { color: var(--gold); font-size: 18px; text-shadow: 0 0 15px rgba(255,204,0,0.8); }
    .tut-box .icon { font-size: 28px; margin-right: 12px; vertical-align: middle; }

    .hud{ display:flex; flex-direction:column; gap:14px; margin-bottom:24px; animation: slideUp 0.6s ease; }
    .hud-top{ display:flex; align-items:center; justify-content:space-between; }
    .day-pill{ font-family:var(--font-mono); font-size:16px; font-weight:900; background:var(--surface); border:2px solid var(--magenta); box-shadow: 0 0 20px rgba(255,0,106,0.5); padding:10px 18px; border-radius:999px; color:var(--magenta); text-shadow: 0 0 10px var(--magenta); }
    .day-pill b{ color:#fff; text-shadow: 0 0 15px #fff; }
    .health-wrap{ display:flex; align-items:center; gap:12px; font-size:14px; font-weight:700; color:var(--muted); flex:1; margin-left:18px; }
    .health-bars{ display:flex; gap:5px; flex:1; }
    .health-seg{ height:14px; flex:1; border-radius:4px; background:var(--surface-2); transition: all .4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    .stats-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .stat-card{ background:rgba(11, 15, 25, 0.9); backdrop-filter: blur(8px); border:1px solid var(--line); border-radius:16px; padding:16px 10px; text-align:center; box-shadow: 0 8px 25px rgba(0,0,0,0.6); transition: all .3s; position: relative; overflow: hidden; }
    .stat-card::after{ content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:linear-gradient(45deg, transparent, rgba(255,255,255,0.03), transparent); transform:rotate(45deg); transition:all .5s; }
    .stat-card:hover::after{ left:100%; }
    .stat-card:hover{ transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.8); border-color: rgba(255,255,255,0.2); }
    .stat-label{ font-size:13px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
    .stat-value{ font-family:var(--font-mono); font-weight:900; font-size:28px; margin-top:6px; }
    .stat-value.money{ color:var(--lime); text-shadow: 0 0 20px rgba(183,255,0,0.8); }
    .stat-value.savings{ color:var(--blue); text-shadow: 0 0 20px rgba(0,208,255,0.8); }
    .stat-value.debt{ color:var(--coral); text-shadow: 0 0 20px rgba(255,0,60,0.8); }

    .goal-track{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; font-size:15px; font-weight:700; color:#8894ab; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
    .goal-track-top{ display:flex; justify-content:space-between; margin-bottom:12px; }
    .goal-bar-bg{ height:12px; background:#080a10; border-radius:6px; overflow:hidden; box-shadow: inset 0 2px 8px rgba(0,0,0,0.8); }
    .goal-bar-fill{ height:100%; background:linear-gradient(90deg, var(--magenta), var(--blue), var(--lime)); border-radius:6px; transition: width .6s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 20px var(--blue); position: relative; }
    .goal-bar-fill::after{ content:''; position:absolute; top:0; left:0; right:0; bottom:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: shine 2s infinite; }
    @keyframes shine { 0%{transform:translateX(-100%);} 100%{transform:translateX(100%);} }

    @keyframes flashUp{ 0%{ transform:scale(1);} 30%{ transform:scale(1.3); color:var(--lime); text-shadow: 0 0 35px var(--lime);} 100%{ transform:scale(1);} }
    @keyframes flashDown{ 0%{ transform:scale(1);} 30%{ transform:scale(1.3); color:var(--coral); text-shadow: 0 0 35px var(--coral);} 100%{ transform:scale(1);} }
    .flash-up{ animation: flashUp .7s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .flash-down{ animation: flashDown .7s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    .receipt-wrap{ flex:1; display:flex; flex-direction:column; animation: slideUp .6s ease, float 5s ease-in-out infinite; perspective: 1000px; }
    .receipt{ background:var(--surface); border:2px solid var(--line); border-bottom: none; border-radius:20px 20px 0 0; padding:30px 28px 24px; position:relative; box-shadow: 0 -15px 50px rgba(0,0,0,0.6); transform-style: preserve-3d; }
    .receipt-tag{ font-family:var(--font-mono); font-size:14px; font-weight:900; letter-spacing:.2em; text-transform:uppercase; color:var(--blue); display:flex; justify-content:space-between; margin-bottom:16px; text-shadow: 0 0 15px rgba(0,208,255,0.6); }
    .receipt-emoji{ font-size:60px; line-height:1; margin-bottom:16px; filter: drop-shadow(0 0 20px rgba(255,255,255,0.5)); transform: translateZ(20px); }
    .receipt-title{ font-size:28px; font-weight:900; margin:0 0 12px; line-height:1.2; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.3); transform: translateZ(10px); }
    .receipt-desc{ font-size:18px; color:#b4c2db; line-height:1.6; margin:0; font-weight: 500; }
    
    .perforation{ height:0; border-top:4px dashed #2a3552; margin:0 28px; position:relative; }
    .perforation::before, .perforation::after{ content:""; position:absolute; top:-12px; width:24px; height:24px; background:var(--bg); border-radius:50%; box-shadow: inset 0 6px 15px rgba(0,0,0,0.9); }
    .perforation::before{ left:-40px; } .perforation::after{ right:-40px; }

    .receipt-options{ background:var(--surface); border:2px solid var(--line); border-top:none; padding:24px 24px 12px; box-shadow: 0 15px 50px rgba(0,0,0,0.6); }
    .choice{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--surface-2); color:#fff; border:2px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:16px; text-align:left; font-size:18px; font-weight:900; transition: all .25s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; }
    .choice::before{ content:''; position:absolute; top:0; left:-100%; width:100%; height:100%; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); transition: left .3s; }
    .choice:hover::before{ left:100%; }
    .choice:hover{ border-color:var(--lime); background:#17223b; transform:translateY(-5px) scale(1.03); box-shadow: 0 10px 30px rgba(183,255,0,0.3); }
    .choice:active{ transform:translateY(0) scale(0.97); }
    .choice-cost{ font-family:var(--font-mono); font-weight:900; font-size:18px; padding:8px 14px; border-radius:10px; z-index: 2; }
    .cost-neg{ color:var(--coral); background:rgba(255,0,60,0.2); text-shadow: 0 0 15px rgba(255,0,60,0.7); box-shadow: inset 0 0 10px rgba(255,0,60,0.2); }
    .cost-pos{ color:var(--lime); background:rgba(183,255,0,0.2); text-shadow: 0 0 15px rgba(183,255,0,0.7); box-shadow: inset 0 0 10px rgba(183,255,0,0.2); }
    .cost-zero{ color:#a3b1c6; background:rgba(255,255,255,0.1); }

    .torn-edge{ height:22px; background: linear-gradient(135deg, transparent 50%, var(--bg) 50%) 0 0/22px 22px repeat-x, linear-gradient(-135deg, transparent 50%, var(--bg) 50%) 0 0/22px 22px repeat-x; margin-top:0; }

    .consequence-card{ background:var(--surface); border:2px solid var(--line); box-shadow: 0 15px 60px rgba(0,0,0,0.8); border-radius:20px; padding:32px 28px; animation: slideUp .5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .consequence-title{ font-size:24px; font-weight:900; margin:0 0 14px; color:#fff; }
    .consequence-text{ font-size:18px; color:#c9cddb; line-height:1.6; margin:0 0 24px; font-weight: 500;}
    .tip-box{ display:flex; gap:14px; align-items:flex-start; background:rgba(255,204,0,0.1); border:1px solid rgba(255,204,0,0.4); box-shadow: 0 0 25px rgba(255,204,0,0.15); border-radius:14px; padding:18px; font-size:16px; color:#fffdf5; line-height:1.6; }
    .tip-box b{ color:var(--gold); text-shadow: 0 0 12px rgba(255,204,0,0.7); font-size:17px; }
    .btn-continue{ width:100%; margin-top:28px; background:#fff; color:#000; font-weight:900; font-size:19px; padding:22px; border-radius:16px; text-transform: uppercase; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); letter-spacing:.05em; }
    .btn-continue:hover{ background:var(--blue); transform:translateY(-4px) scale(1.02); box-shadow: 0 10px 35px rgba(0,208,255,0.6); color:#000; letter-spacing:.1em; }

    .info-card{ background:var(--surface); border:2px solid var(--line); box-shadow: 0 15px 60px rgba(0,0,0,0.7); border-radius:20px; padding:40px 28px; text-align:center; animation: slideUp .5s ease, float 4s ease-in-out infinite; }
    .info-emoji{ font-size:70px; margin-bottom:20px; filter: drop-shadow(0 0 25px rgba(255,255,255,0.5));}
    .info-title{ font-size:26px; font-weight:900; margin:0 0 12px; color:#fff; }
    .info-text{ font-size:18px; color:#a3b1c6; margin:0 0 12px; line-height:1.6; }
    .mandatory-amount{ font-family:var(--font-mono); font-size:42px; font-weight:900; color:var(--coral); margin:20px 0; text-shadow: 0 0 30px rgba(255,0,60,0.8); }

    .end-screen{ flex:1; display:flex; flex-direction:column; animation: slideUp .7s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .end-header{ text-align:center; margin-bottom:28px; }
    .end-title{ font-size:46px; font-weight:900; margin:0 0 10px; color:#fff; text-shadow: 0 0 25px rgba(255,255,255,0.5), 0 0 10px rgba(255,255,255,0.8); }
    .end-rank{ display:inline-block; margin-top:14px; font-family:var(--font-mono); font-size:22px; font-weight:900; padding:14px 30px; border-radius:999px; border:3px solid; box-shadow: 0 0 40px rgba(0,0,0,0.6); background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); }
    
    .end-stats{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:28px 0; }
    .end-stat{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; text-align:center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .end-stat:hover{ transform: translateY(-6px) scale(1.05); box-shadow: 0 12px 35px rgba(0,0,0,0.6); border-color: rgba(255,255,255,0.2); }
    .end-stat-label{ font-size:14px; color:#8894ab; text-transform:uppercase; letter-spacing:.1em; font-weight: 900; }
    .end-stat-value{ font-family:var(--font-mono); font-weight:900; font-size:32px; margin-top:8px; }

    .end-notes{ display:flex; flex-direction:column; gap:16px; margin:12px 0 30px; }
    .note-row{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; font-size:16px; line-height:1.6; font-weight: 500; }
    .note-row b{ display:block; font-size:14px; text-transform:uppercase; letter-spacing:.1em; margin-bottom:10px; font-weight: 900; }
    .note-good b{ color:var(--lime); text-shadow: 0 0 15px rgba(183,255,0,0.7); }
    .note-bad b{ color:var(--coral); text-shadow: 0 0 15px rgba(255,0,60,0.7); }
    
    .end-actions{ display:flex; gap:16px; margin-top:auto; }
    .end-actions button{ flex:1; padding: 22px; font-size: 18px; border-radius: 16px; font-weight: 900; text-transform: uppercase; }
    
    .seg-green{ background:var(--lime) !important; box-shadow: 0 0 20px rgba(183,255,0,0.9); }
    .seg-yellow{ background:var(--amber) !important; box-shadow: 0 0 20px rgba(255,170,0,0.9); }
    .seg-red{ background:var(--coral) !important; box-shadow: 0 0 20px rgba(255,0,60,0.9); animation: pulseRed 1s infinite; }
    @keyframes pulseRed { 0%{box-shadow:0 0 10px rgba(255,0,60,0.5);} 50%{box-shadow:0 0 30px rgba(255,0,60,1);} 100%{box-shadow:0 0 10px rgba(255,0,60,0.5);} }

    @keyframes billFall { 0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg) scale(2); opacity: 0; } }
    .fx-bill { position: absolute; font-size: 4rem; filter: drop-shadow(0 0 15px rgba(255,0,60,0.8)); z-index: 99999; }

    @keyframes stonksAnim { 0% { transform: translate(-20vw, 100vh) scale(0.5) rotate(-25deg); opacity: 0; } 20% { opacity: 1; transform: translate(10vw, 60vh) scale(1.5) rotate(-10deg); } 80% { opacity: 1; transform: translate(60vw, 20vh) scale(2) rotate(10deg); } 100% { transform: translate(120vw, -20vh) scale(3) rotate(25deg); opacity: 0; } }
    .fx-stonks { position: absolute; display: flex; align-items: center; gap: 25px; font-family: var(--font-display); font-weight: 900; font-size: 6rem; color: var(--lime); text-shadow: 0 0 50px var(--lime), 0 0 100px rgba(183,255,0,1); filter: drop-shadow(0 0 30px rgba(0,0,0,0.9)); z-index: 99999; }
    .fx-stonks span { font-size: 8rem; animation: bounce 0.5s infinite alternate; }
    @keyframes bounce { from{transform:translateY(0);} to{transform:translateY(-20px);} }

    .mouse-particle { position: absolute; border-radius: 50%; pointer-events: none; animation: particleFade 0.6s ease-out forwards; z-index: 99997; mix-blend-mode: screen; }
    @keyframes particleFade { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }

    @keyframes confettiFall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    .confetti { position: absolute; width: 10px; height: 30px; z-index: 99999; animation: confettiFall 3s linear forwards; }
</style>
</head>
<body>
<div id="scanlines"></div>
<canvas id="bgCanvas"></canvas>
<div id="trail-layer"></div>
<div id="fx-layer"></div>
<div id="app"></div>
<script>
const cvs = document.getElementById('bgCanvas');
const ctx = cvs.getContext('2d');
let chars = [];
const cols = ['#b7ff00', '#ff006a', '#00d0ff', '#ffcc00'];

function resize(){ cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

for(let i=0; i<70; i++){
    chars.push({ x: Math.random() * cvs.width, y: Math.random() * cvs.height, s: Math.random() * 25 + 15, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5, c: cols[Math.floor(Math.random() * cols.length)], type: ['$', '€', '¥', '¢'][Math.floor(Math.random()*4)] });
}

function drawBg(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    for(let i=0; i<chars.length; i++){
        for(let j=i; j<chars.length; j++){
            let dx = chars[i].x - chars[j].x, dy = chars[i].y - chars[j].y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 180){
                ctx.beginPath(); ctx.strokeStyle = chars[i].c;
                ctx.globalAlpha = 1 - (dist/180); ctx.lineWidth = 1.5;
                ctx.moveTo(chars[i].x, chars[i].y); ctx.lineTo(chars[j].x, chars[j].y);
                ctx.stroke();
            }
        }
    }
    chars.forEach(p => {
        ctx.globalAlpha = 1; ctx.shadowBlur = 20; ctx.shadowColor = p.c;
        ctx.fillStyle = p.c; ctx.font = `900 ${p.s}px monospace`;
        ctx.fillText(p.type, p.x, p.y); ctx.shadowBlur = 0;
        p.x += p.vx; p.y += p.vy;
        if(p.x < -40) p.x = cvs.width + 40; if(p.x > cvs.width + 40) p.x = -40;
        if(p.y < -40) p.y = cvs.height + 40; if(p.y > cvs.height + 40) p.y = -40;
    });
    requestAnimationFrame(drawBg);
}
drawBg();

const trailLayer = document.getElementById('trail-layer');
window.addEventListener('mousemove', (e) => {
    let p = document.createElement('div');
    p.className = 'mouse-particle';
    p.style.left = e.clientX + 'px';
    p.style.top = e.clientY + 'px';
    let size = Math.random() * 8 + 4;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    let c = cols[Math.floor(Math.random() * cols.length)];
    p.style.background = c;
    p.style.boxShadow = `0 0 10px ${c}, 0 0 20px ${c}`;
    trailLayer.appendChild(p);
    setTimeout(() => p.remove(), 600);
});

function triggerShake() {
    const appDiv = document.getElementById('app');
    appDiv.classList.remove('shake-active');
    void appDiv.offsetWidth;
    appDiv.classList.add('shake-active');
}

function fxGastos(){
    triggerShake();
    const layer = document.getElementById('fx-layer');
    for(let i=0; i<35; i++){
        let b = document.createElement('div');
        b.className = 'fx-bill';
        b.innerText = ['💸','📉','🩸','💀','🔥'][Math.floor(Math.random()*5)];
        b.style.left = (Math.random() * 100) + 'vw';
        b.style.animation = `billFall ${Math.random()*1.5 + 1}s cubic-bezier(.2,.8,.2,1) ${Math.random()*0.3}s forwards`;
        layer.appendChild(b);
        setTimeout(()=>b.remove(), 3000);
    }
}

function fxStonks(){
    const layer = document.getElementById('fx-layer');
    let s = document.createElement('div');
    s.className = 'fx-stonks';
    s.innerHTML = '<span>🚀</span> STONKS';
    s.style.animation = 'stonksAnim 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
    layer.appendChild(s);
    setTimeout(()=>s.remove(), 2500);
}

function fxConfetti(){
    const layer = document.getElementById('fx-layer');
    for(let i=0; i<100; i++){
        let c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = (Math.random() * 100) + 'vw';
        c.style.background = cols[Math.floor(Math.random() * cols.length)];
        c.style.animation = `confettiFall ${Math.random()*2 + 2}s linear ${Math.random()*0.5}s forwards`;
        layer.appendChild(c);
        setTimeout(()=>c.remove(), 4500);
    }
}

const TOTAL_DAYS = 30, GOAL_AMOUNT = 200;
let state = null;

function getInitialState(){ return { day: 1, money: 600, savings: 100, debt: 0, goal: GOAL_AMOUNT, health: 68, impulsiveSpent: 0, goodDecisions: 0, badDecisions: 0, usedEventIds: [], lastEventId: null, decisions: [], pendingEvent: null, gameOver: false }; }

const MANDATORY_EXPENSES = { 7: { label: "Alquiler / vivienda", amount: 150 }, 14: { label: "Celular / Datos", amount: 30 }, 21: { label: "Internet Fibra", amount: 25 }, 28: { label: "Servicios Varios", amount: 15 } };

    { id:"e10", emoji:"🔋", title:"Batería Agotada", desc:"La batería de tu laptop murió. $45.", options:[ {label:"Original",cost:"-$45",apply:()=>({money:-45,quality:1,consequence:"Tu equipo funciona seguro.",tip:"En hardware vital, lo barato sale caro."})}, {label:"Genérica",cost:"-$20",apply:()=>({money:-20,quality:-2,consequence:"Peligro de sobrecalentamiento.",tip:"No escatimes en herramientas de trabajo."})}, {label:"Siempre conectada",cost:"$0",apply:()=>({money:0,quality:0,consequence:"Incómodo, pero gratis.",tip:"Solución temporal válida."})} ]}
];

const SPECIAL = { id:"esp", emoji:"🚨", title:"ALERTA ROJA", desc:"Tu celular principal falló catastróficamente.", special:true, options:[ {label:"Reparar",cost:"-$80",apply:()=>({money:-80,quality:1,consequence:"Reparado y funcionando.",tip:"Usa tu fondo de emergencias."})}, {label:"Gama Alta Nuevo",cost:"-$300",apply:()=>({money:-300,quality:-2,impulse:true,consequence:"Gasto masivo impulsivo.",tip:"Piensa en frío durante las crisis."})}, {label:"Pedir Prestado",cost:"$0",apply:()=>({money:0,quality:0,consequence:"Te prestaron uno antiguo.",tip:"Solución creativa y barata."})} ]};

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function fmt(n){ return (n<0?"-$":"$") + Math.abs(Math.round(n)); }

function pickEvent(){
    if(state.day === 17) return SPECIAL;
    if(Math.random() < 0.12) return null; 
    const pool = EVENTS.filter(e => e.id !== state.lastEventId);
    return pool[Math.floor(Math.random()*pool.length)];
}

function recompute(){
    let h = 50 + (state.money/600)*22 + (state.savings/state.goal)*20 - (state.debt/300)*28 - Math.min(20, state.impulsiveSpent/25) + state.goodDecisions*1.2 - state.badDecisions*1.5;
    state.health = clamp(Math.round(h), 0, 100);
}

function hColor(){ return state.health>=60?"seg-green":state.health>=30?"seg-yellow":"seg-red"; }

const app = document.getElementById("app");

function renderStart(){
    app.innerHTML = `<div class="start-screen"><div class="start-badge">VERSIÓN OVERKILL</div><h1 class="start-title">SOBREVIVE<br>AL MES</h1><p class="start-desc">Administra tu dinero, toma decisiones y pon a prueba tus habilidades al máximo nivel.</p><button class="btn-primary" id="startBtn">INICIAR SIMULACIÓN</button></div>`;
    document.getElementById("startBtn").addEventListener("click", tutorial);
}

function tutorial(){
    app.innerHTML = `<div class="tutorial-screen"><h2 style="margin:0;font-size:42px;text-shadow:0 0 25px rgba(0,208,255,0.8);color:var(--blue);font-weight:900;">REGLAS</h2><div class="tut-box"><span class="icon">💰</span> <b>Capital:</b> Inicias con $600. Llegas a $0 = GAME OVER.</div><div class="tut-box"><span class="icon">🎯</span> <b>Objetivo:</b> Acumula $200 ahorrados.</div><div class="tut-box"><span class="icon">🧾</span> <b>Sistema:</b> Cobros fijos los días 7, 14, 21, 28.</div><div class="tut-box"><span class="icon">❤️</span> <b>Salud:</b> Controla tus impulsos para no quebrar.</div><button class="btn-primary" id="playBtn">¡ENTRAR!</button></div>`;
    document.getElementById("playBtn").addEventListener("click", ()=>{ state = getInitialState(); runDay(); });
}

function hudHtml(){
    let segs = "";
    for(let i=0;i<10;i++) segs += `<div class="health-seg ${i<Math.round(state.health/10)?hColor():''}"></div>`;
    let pct = clamp(Math.round((state.savings/state.goal)*100),0,100);
    return `<div class="hud"><div class="hud-top"><div class="day-pill">📅 DÍA <b>${state.day}</b>/${TOTAL_DAYS}</div><div class="health-wrap"><span>SALUD FINANCIERA</span><div class="health-bars">${segs}</div></div></div><div class="stats-row"><div class="stat-card"><div class="stat-label">Liquidez</div><div class="stat-value money" id="statMoney">${fmt(state.money)}</div></div><div class="stat-card"><div class="stat-label">Reserva</div><div class="stat-value savings" id="statSavings">${fmt(state.savings)}</div></div><div class="stat-card"><div class="stat-label">Pasivos</div><div class="stat-value debt" id="statDebt">${fmt(state.debt)}</div></div></div><div class="goal-track"><div class="goal-track-top"><span>🎯 PROGRESO META</span><span>${pct}%</span></div><div class="goal-bar-bg"><div class="goal-bar-fill" style="width:${pct}%"></div></div></div></div>`;
}

function runDay(){
    if(state.day > TOTAL_DAYS) return end("victory");
    let m = MANDATORY_EXPENSES[state.day];
    if(m){
        app.innerHTML = `${hudHtml()}<div class="receipt-wrap"><div class="info-card"><div class="info-emoji">🧾</div><div class="info-title">COBRO AUTOMÁTICO</div><div class="info-text">${m.label}</div><div class="mandatory-amount">-${fmt(m.amount)}</div><button class="btn-continue" id="mBtn">AUTORIZAR PAGO</button></div></div>`;
        document.getElementById("mBtn").addEventListener("click", ()=>{ fxGastos(); state.money -= m.amount; recompute(); if(state.money<0) return end("defeat"); doEvt(); });
    } else doEvt();
}

function doEvt(){
    let e = pickEvent();
    if(!e){
        app.innerHTML = `${hudHtml()}<div class="receipt-wrap"><div class="info-card"><div class="info-emoji">🌤️</div><div class="info-title">JORNADA TRANQUILA</div><div class="info-text">No hubieron imprevistos.</div><button class="btn-continue" id="fBtn">AVANZAR TIEMPO</button></div></div>`;
        document.getElementById("fBtn").addEventListener("click", ()=>{ state.day++; runDay(); });
        return;
    }
    state.pendingEvent = e;
    let opts = e.options.map((o,i)=>{
        let c = o.cost.includes("-")?"cost-neg":o.cost.includes("+")?"cost-pos":"cost-zero";
        return `<button class="choice" data-i="${i}"><span>${o.label}</span><span class="choice-cost ${c}">${o.cost}</span></button>`;
    }).join("");
    app.innerHTML = `${hudHtml()}<div class="receipt-wrap"><div class="receipt"><div class="receipt-tag"><span>REGISTRO DÍA ${state.day}</span><span>INCIDENCIA</span></div><div class="receipt-emoji">${e.emoji}</div><h2 class="receipt-title">${e.title}</h2><p class="receipt-desc">${e.desc}</p></div><div class="perforation"></div><div class="receipt-options">${opts}</div><div class="torn-edge"></div></div>`;
    document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click", ()=>resolve(e, e.options[b.dataset.i])));
}

function resolve(e, o){
    let r = o.apply();
    if(r.money) state.money += r.money; if(r.savings) state.savings += r.savings; if(r.debt) state.debt += r.debt;
    if(r.impulse && r.money) state.impulsiveSpent += Math.abs(r.money);
    if(r.quality >= 1) state.goodDecisions++; if(r.quality <= -1) state.badDecisions++;
    state.decisions.push({day:state.day, label:o.label, quality:r.quality}); state.lastEventId = e.id;
    recompute();
    
    if(r.money < 0 || r.quality <= -1) fxGastos(); 
    if(r.quality >= 1) fxStonks();
    if(r.quality === 2) fxConfetti();

    app.innerHTML = `${hudHtml()}<div class="receipt-wrap"><div class="consequence-card"><h3 class="consequence-title">${r.quality>=1?"✅":r.quality<=-1?"⚠️":"➖"} ${o.label}</h3><p class="consequence-text">${r.consequence}</p><div class="tip-box"><span>💡</span><div><b>ANÁLISIS:</b> ${r.tip}</div></div><button class="btn-continue" id="cBtn">CONFIRMAR</button></div></div>`;
    let fm = document.getElementById("statMoney"), fs = document.getElementById("statSavings"), fd = document.getElementById("statDebt");
    if(r.money) { fm.classList.remove("flash-up","flash-down"); void fm.offsetWidth; fm.classList.add(r.money>0?"flash-up":"flash-down"); }
    if(r.savings){ fs.classList.remove("flash-up","flash-down"); void fs.offsetWidth; fs.classList.add("flash-up"); }
    if(r.debt){ fd.classList.remove("flash-up","flash-down"); void fd.offsetWidth; fd.classList.add("flash-down"); }
    document.getElementById("cBtn").addEventListener("click", ()=>{ if(state.money<0) return end("defeat"); state.day++; runDay(); });
}

function end(t){
    recompute();
    if(t === "defeat") triggerShake();
    else fxConfetti();
    let s = clamp(Math.round(state.health*0.55 + clamp((state.savings/state.goal)*100,0,100)*0.25 + (state.debt===0?20:Math.max(0,20-state.debt/15)) - Math.min(15,state.impulsiveSpent/20)),0,100);
    let r = s>=90?{e:"🏆",l:"MAESTRO",c:"var(--lime)"}:s>=70?{e:"🥇",l:"EFICIENTE",c:"var(--blue)"}:s>=50?{e:"🥈",l:"NOVATO",c:"var(--amber)"}:{e:"🚨",l:"BANCARROTA",c:"var(--coral)"};
    let b = state.decisions.length ? state.decisions.reduce((p,c)=>p.quality>c.quality?p:c,state.decisions[0]) : null;
    let w = state.decisions.length ? state.decisions.reduce((p,c)=>p.quality<c.quality?p:c,state.decisions[0]) : null;
    app.innerHTML = `<div class="end-screen"><div class="end-header"><h1 class="end-title">${t==="victory"?"SIMULACIÓN EXITOSA":"FONDOS INSUFICIENTES"}</h1><div class="end-rank" style="color:${r.c};border-color:${r.c};text-shadow:0 0 20px ${r.c}">${r.e} ${r.l}</div></div><div class="end-stats"><div class="end-stat"><div class="end-stat-label">Liquidez Final</div><div class="end-stat-value money">${fmt(Math.max(0,state.money))}</div></div><div class="end-stat"><div class="end-stat-label">Total Ahorrado</div><div class="end-stat-value savings">${fmt(state.savings)}</div></div><div class="end-stat"><div class="end-stat-label">Deuda Viva</div><div class="end-stat-value debt">${fmt(state.debt)}</div></div><div class="end-stat"><div class="end-stat-label">Puntuación</div><div class="end-stat-value">${state.health}/100</div></div></div><div class="end-notes">${b?`<div class="note-row note-good"><b>Mejor Movimiento</b>Día ${b.day}: ${b.label}</div>`:""}${w?`<div class="note-row note-bad"><b>Fallo Crítico</b>Día ${w.day}: ${w.label}</div>`:""}</div><button class="btn-primary" id="rBtn">NUEVA SIMULACIÓN</button></div>`;
    document.getElementById("rBtn").addEventListener("click", renderStart);
}
renderStart();
</script>
