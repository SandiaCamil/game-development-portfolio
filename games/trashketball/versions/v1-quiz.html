<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trashketball · Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --court-dark:#0F3D2E;
    --court-mid:#175C43;
    --court-line:#EDEADF;
    --lime:#C6FF3D;
    --organic:#C8712B;
    --organic-dark:#8F4E1B;
    --recycle:#2F80ED;
    --recycle-dark:#1F5FB8;
    --trash:#4A4A52;
    --trash-dark:#302F35;
    --red:#FF4D4D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:var(--court-dark);font-family:'Rubik',sans-serif;color:var(--court-line);}
  #wrap{
    position:relative;min-height:100vh;width:100%;
    background:linear-gradient(180deg, var(--court-mid) 0%, var(--court-dark) 100%);
    display:flex;flex-direction:column;align-items:center;
  }
  .hidden{display:none !important;}
  h1.title{
    font-family:'Bungee',cursive;
    font-size:clamp(2.2rem,9vw,4rem);
    color:var(--lime);
    letter-spacing:1px;
    margin:0 0 6px 0;
    text-shadow:4px 4px 0 var(--trash-dark);
  }
  .subtitle{font-size:clamp(0.95rem,3vw,1.1rem);opacity:0.85;max-width:480px;margin:0 0 24px 0;line-height:1.5;}
  .subtitle b{color:var(--lime);}
  button{
    font-family:'Bungee',cursive;
    cursor:pointer;
    letter-spacing:0.5px;
  }
  .startBtn, .retryBtn{
    background:var(--lime);
    color:var(--court-dark);
    border:none;
    padding:16px 40px;
    font-size:1.1rem;
    border-radius:100px;
    box-shadow:0 6px 0 #8ec221;
    transition:transform .08s ease;
  }
  .startBtn:active, .retryBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #8ec221;}
  .legend{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap;justify-content:center;}
  .chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);padding:8px 14px;border-radius:100px;font-size:0.85rem;}
  .dot{width:12px;height:12px;border-radius:50%;}
  .result-score{font-family:'Bungee',cursive;font-size:clamp(2.3rem,10vw,3.4rem);color:var(--lime);margin:6px 0 18px 0;}
  footer.credit{font-size:0.72rem;opacity:0.55;margin-top:22px;}

  .overlay{
    width:100%;max-width:520px;padding:40px 24px;text-align:center;
  }

  #hud{
    width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px;box-sizing:border-box;
  }
  .score-box{font-family:'Bungee',cursive;color:var(--lime);font-size:1.3rem;background:rgba(15,61,46,0.7);padding:8px 16px;border-radius:12px;border:2px solid rgba(198,255,61,0.4);}
  .lives-box{display:flex;gap:6px;background:rgba(15,61,46,0.7);padding:8px 12px;border-radius:12px;}
  .life{font-size:1.4rem;filter:grayscale(0);transition:opacity .2s;}
  .life.lost{opacity:0.15;filter:grayscale(1);}

  #timerBarBg{width:100%;max-width:520px;height:6px;background:rgba(0,0,0,0.35);border-radius:4px;overflow:hidden;}
  #timerBarFg{height:100%;width:100%;background:var(--lime);transition:width 0.2s linear;}

  #playArea{width:100%;max-width:520px;padding:20px 18px 30px;box-sizing:border-box;text-align:center;}

  #itemCard{
    background:rgba(255,255,255,0.06);
    border:2px solid rgba(198,255,61,0.25);
    border-radius:24px;
    padding:36px 16px;
    margin:18px 0 22px;
  }
  #itemEmoji{font-size:clamp(60px,18vw,90px); line-height:1;}
  #itemHint{font-size:1rem; opacity:0.75; margin-top:10px;}

  #binButtons{display:flex; flex-direction:column; gap:14px;}
  .binBtn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:clamp(0.95rem,3.5vw,1.15rem);
    color:#fff; border:none; border-radius:16px;
    padding:18px 14px;
    box-shadow:0 6px 0 rgba(0,0,0,0.25);
    transition:transform .08s ease, filter .1s ease;
  }
  .binBtn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.25);}
  .binBtn[disabled]{cursor:default;}
  .binBtn.correct{outline:3px solid #fff; filter:brightness(1.15);}
  .binBtn.wrong{filter:brightness(0.6);}
  .binIcon{font-size:1.3rem;}

  #toast{
    min-height:34px; margin-top:16px;
    font-family:'Bungee',cursive; font-size:clamp(1rem,4vw,1.3rem);
    padding:10px 18px; border-radius:14px; opacity:0; transform:scale(0.85);
    transition:opacity .15s, transform .15s; display:inline-block;
  }
  #toast.show{opacity:1; transform:scale(1);}
  .toast-good{background:var(--lime); color:var(--court-dark);}
  .toast-bad{background:var(--red); color:#fff;}
</style>
</head>
<body>
<div id="wrap">

  <div id="startScreen" class="overlay">
    <h1 class="title">TRASHKETBALL</h1>
    <p class="subtitle">Se te muestra un residuo. Toca el <b>bote correcto</b> según su tipo. <b>3 vidas</b>, <b>60 segundos</b>.</p>
    <div class="legend">
      <div class="chip"><span class="dot" style="background:var(--organic)"></span>Orgánico</div>
      <div class="chip"><span class="dot" style="background:var(--recycle)"></span>Reciclable</div>
      <div class="chip"><span class="dot" style="background:var(--trash)"></span>No reciclable</div>
    </div>
    <button class="startBtn" id="playBtn" style="margin-top:26px;">JUGAR</button>
    <footer class="credit">EcoAcción · Prototipo educativo de reciclaje</footer>
  </div>

  <div id="hud" class="hidden">
    <div class="score-box">🏆 <span id="scoreVal">0</span></div>
    <div class="lives-box">
      <span class="life" id="life0">🗑️</span>
      <span class="life" id="life1">🗑️</span>
      <span class="life" id="life2">🗑️</span>
    </div>
  </div>
  <div id="timerBarBg" class="hidden"><div id="timerBarFg"></div></div>

  <div id="playArea" class="hidden">
    <div id="itemCard">
      <div id="itemEmoji">🍌</div>
      <div id="itemHint">¿A qué bote va este residuo?</div>
    </div>
    <div id="binButtons"></div>
    <div id="toast"></div>
  </div>

  <div id="endScreen" class="overlay hidden">
    <h1 class="title" id="endTitle">¡GANASTE!</h1>
    <div class="result-score" id="endScore">0 pts</div>
    <p class="subtitle" id="endMsg">Aprendiste a separar la basura correctamente.</p>
    <button class="retryBtn" id="retryBtn">JUGAR DE NUEVO</button>
  </div>

</div>

<script>
(function(){
  // ---------- Categories ----------
  const CATS = {
    organic:  {label:'Orgánico',      color:'#C8712B', items:['🍌','🍎','🍂','🍞']},
    recycle:  {label:'Reciclable',    color:'#2F80ED', items:['🥤','♻️','📦','🧴']},
    trash:    {label:'No reciclable', color:'#4A4A52', items:['🧦','🖊️','🩹','🥫']}
  };
  const CAT_KEYS = Object.keys(CATS);

  // ---------- Game state ----------
  let score = 0, lives = 3, timeLeft = 60;
  let timerInterval = null;
  let currentItem = null;
  let answered = false;

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function spawnItem(){
    const key = CAT_KEYS[Math.floor(Math.random()*CAT_KEYS.length)];
    const emoji = CATS[key].items[Math.floor(Math.random()*CATS[key].items.length)];
    currentItem = { cat:key, emoji };
    answered = false;
    document.getElementById('itemEmoji').textContent = emoji;
    document.getElementById('itemHint').textContent = '¿A qué bote va este residuo?';
    document.getElementById('toast').className = '';
    document.getElementById('toast').textContent = '';
    renderBinButtons();
  }

  function renderBinButtons(){
    const wrap = document.getElementById('binButtons');
    wrap.innerHTML = '';
    const keys = shuffle([...CAT_KEYS]);
    keys.forEach(key => {
      const cat = CATS[key];
      const btn = document.createElement('button');
      btn.className = 'binBtn';
      btn.style.background = cat.color;
      btn.innerHTML = `<span class="binIcon">🗑️</span> ${cat.label}`;
      btn.onclick = () => selectBin(key, btn);
      wrap.appendChild(btn);
    });
  }

  function selectBin(key, btn){
    if(answered) return;
    answered = true;
    const buttons = document.querySelectorAll('.binBtn');
    buttons.forEach(b => b.disabled = true);

    if(key === currentItem.cat){
      addScore(10);
      btn.classList.add('correct');
      showToast('¡Correcto! +10', true);
    } else {
      addScore(-5);
      btn.classList.add('wrong');
      buttons.forEach(b => {
        if(b.textContent.includes(CATS[currentItem.cat].label)) b.classList.add('correct');
      });
      showToast('Va en "'+CATS[currentItem.cat].label+'" · -1 vida', false);
      loseLife();
    }

    setTimeout(()=>{ if(lives>0 && timeLeft>0) spawnItem(); }, 750);
  }

  function resetGame(){
    score = 0; lives = 3; timeLeft = 60;
    document.getElementById('scoreVal').textContent = score;
    for(let i=0;i<3;i++) document.getElementById('life'+i).classList.remove('lost');
    updateTimerBar();
    spawnItem();
  }

  function updateTimerBar(){
    const pct = Math.max(0, timeLeft/60*100);
    document.getElementById('timerBarFg').style.width = pct+'%';
  }

  function loseLife(){
    lives--;
    const idx = lives;
    if(idx>=0) document.getElementById('life'+idx).classList.add('lost');
    if(lives<=0){ setTimeout(()=>endGame(false), 200); }
  }

  function addScore(n){
    score = Math.max(0, score+n);
    document.getElementById('scoreVal').textContent = score;
  }

  function showToast(text, good){
    const t = document.getElementById('toast');
    t.textContent = text;
    t.className = good ? 'toast-good show' : 'toast-bad show';
  }

  function endGame(won){
    clearInterval(timerInterval);
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('timerBarBg').classList.add('hidden');
    document.getElementById('playArea').classList.add('hidden');
    const endScreen = document.getElementById('endScreen');
    document.getElementById('endTitle').textContent = won ? '¡GANASTE!' : 'FIN DEL JUEGO';
    document.getElementById('endTitle').style.color = won ? 'var(--lime)' : 'var(--red)';
    document.getElementById('endScore').textContent = score + ' pts';
    document.getElementById('endMsg').textContent = won
      ? 'Encestaste la basura correctamente y aprendiste a reciclar. ¡EcoAcción está orgullosa!'
      : 'Se acabaron tus vidas. Revisa bien de qué material es cada residuo antes de elegir.';
    endScreen.classList.remove('hidden');
  }

  function beginRound(){
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('timerBarBg').classList.remove('hidden');
    document.getElementById('playArea').classList.remove('hidden');
    resetGame();
    clearInterval(timerInterval);
    timerInterval = setInterval(()=>{
      timeLeft--;
      updateTimerBar();
      if(timeLeft<=0){ clearInterval(timerInterval); endGame(true); }
    }, 1000);
  }

  document.getElementById('playBtn').addEventListener('click', ()=>{
    document.getElementById('startScreen').classList.add('hidden');
    beginRound();
  });

  document.getElementById('retryBtn').addEventListener('click', ()=>{
    document.getElementById('endScreen').classList.add('hidden');
    beginRound();
  });
})();
</script>
</body>
</html>
